apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training

spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app: model-training

    spec:
      restartPolicy: Never

      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent

          env:
            - name: TRAINING_CONFIG
              value: /app/config/training_config.yaml

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: training-config
              mountPath: /app/config
              readOnly: true

            - name: training-data
              mountPath: /app/data

            - name: checkpoints
              mountPath: /app/checkpoints

      volumes:
        - name: training-config
          configMap:
            name: training-config

        - name: training-data
          emptyDir: {}

        - name: checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints