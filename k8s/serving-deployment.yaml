apiVersion: apps/v1
kind: Deployment

metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: model-serving

  template:
    metadata:
      labels:
        app: model-serving

    spec:
      containers:
        - name: model-serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              protocol: TCP

          env:
            - name: MODEL_PATH
              value: /app/checkpoints/classifier_v1.pt

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000

      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints